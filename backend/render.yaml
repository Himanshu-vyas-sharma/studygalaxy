services:
  - type: web
    name: studygalaxy-backend
    runtime: node
    rootDir: backend
    plan: free           # no persistent disk on free — data lives in Turso
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      # Set both of these in the Render dashboard (Environment tab):
      #   DATABASE_URL        libsql://studygalaxy-<org>.turso.io
      #   DATABASE_AUTH_TOKEN eyJ...
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false      # your frontend origin, e.g. https://studygalaxy.netlify.app
